<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#091326">
<meta name="description" content="導領之路：國考攻防戰 — 奇幻國考冒險遊戲">
<meta property="og:title" content="導領之路：國考攻防戰">
<meta property="og:image" content="https://martin-d-lin.github.io/dao-ling-guo-kao/cover.jpg">
<title>導領之路：國考攻防戰</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#091326}
body{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(10px,2vh,24px) clamp(10px,2vw,28px);background:radial-gradient(ellipse at 50% 30%,#23385f 0%,#091326 80%)}
main{width:min(1200px,100%);display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2vh,22px)}
.cover{display:block;max-width:100%;width:auto;height:auto;max-height:calc(100svh - 125px);object-fit:contain;border-radius:clamp(6px,1vw,14px);box-shadow:0 18px 55px #0009}
.play{display:inline-flex;justify-content:center;align-items:center;min-height:54px;padding:14px 48px;background:linear-gradient(135deg,#ffe8a0,#edbb55);color:#261907;font-weight:900;font-size:clamp(16px,1.5vw,20px);text-decoration:none;border-radius:999px;box-shadow:0 8px 28px #eebd5570;transition:transform .2s,filter .2s}
.play:hover{transform:translateY(-2px);filter:brightness(1.06)}
.play:focus-visible{outline:3px solid white;outline-offset:4px}
@media(max-width:600px){body{padding:12px}main{gap:20px}.cover{max-height:calc(100svh - 120px)}.play{width:min(320px,100%)}}
@media(prefers-reduced-motion:reduce){.play{transition:none}}
</style>
</head>
<body>
<main>
<img class="cover" src="cover.jpg" alt="導領之路：國考攻防戰 遊戲封面，點擊下方按鈕開始遊戲" width="1600" height="900">
<a class="play" href="https://larch.ink/play/9wTA3HwP35la3tsy3Ho7QESXVdqT-gjjEichrQ">開始遊戲 ↗</a>
</main>
</body>
</html>
